name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"
  SOURCE_DATE_EPOCH: "946684800"

jobs:
  rust:
    name: Rust / ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x86_64
            binary: target/release/paint-ui.exe
          - os: macos-14
            platform: macos-aarch64
            binary: target/release/paint-ui
          - os: ubuntu-24.04
            platform: linux-x86_64
            binary: target/release/paint-ui
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      - name: Fetch locked dependencies
        run: bash ./tools/cargo-pinned.sh fetch --locked
      - name: ShellCheck build and native launchers
        if: matrix.os == 'ubuntu-24.04'
        run: shellcheck tools/cargo-pinned.sh plugin-host/test-cross-language.sh tools/macos_native_window_smoke.sh
      - name: Check formatting
        run: bash ./tools/cargo-pinned.sh fmt --all -- --check
      - name: Clippy
        run: bash ./tools/cargo-pinned.sh clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Unit, property, integration, and usability tests
        run: bash ./tools/cargo-pinned.sh test --workspace --all-features --locked
      - name: Stub and suspicious-test scan
        run: bash ./tools/cargo-pinned.sh run --locked -p xtask -- scan-stubs
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.201
      - name: Restore locked .NET dependencies
        run: dotnet restore plugin-host/Paint.PluginHost.sln --locked-mode
      - name: .NET host and protocol tests
        run: dotnet test plugin-host/Paint.PluginHost.sln --configuration Release --no-restore
      - name: Real Rust to .NET plugin conformance
        shell: bash
        run: plugin-host/test-cross-language.sh
      - name: Independent PNG parity-oracle tests
        run: python3 -m unittest discover -s tests/e2e -p 'test_*.py' -v
      - name: Preview packaging tests
        run: python3 -m unittest discover -s tools/package/tests -p 'test_*.py' -v
      - name: Reference harness unit tests
        run: python3 -m unittest discover -s tools/reference/tests -p 'test_*.py' -v
      - name: Release build
        run: bash ./tools/cargo-pinned.sh build --workspace --release --all-features --locked
      - name: Reproduce and verify release binary and complete internal package
        run: |
          binary_name="$(basename "${{ matrix.binary }}")"
          CARGO_TARGET_DIR=repro-a bash ./tools/cargo-pinned.sh build --release --locked --package paint-ui
          CARGO_TARGET_DIR=repro-b bash ./tools/cargo-pinned.sh build --release --locked --package paint-ui
          python3 tools/package/verify_reproduction.py "repro-a/release/${binary_name}" "repro-b/release/${binary_name}"
          python3 tools/package/preview_package.py \
            --binary "repro-a/release/${binary_name}" \
            --platform "${{ matrix.platform }}" \
            --output-dir ci-dist-a \
            --repeat 2 \
            --timeout 30 \
            --distribution internal-preview \
            --cargo-command bash ./tools/cargo-pinned.sh
          python3 tools/package/preview_package.py \
            --binary "repro-b/release/${binary_name}" \
            --platform "${{ matrix.platform }}" \
            --output-dir ci-dist-b \
            --repeat 2 \
            --timeout 30 \
            --distribution internal-preview \
            --cargo-command bash ./tools/cargo-pinned.sh
          python3 tools/package/verify_reproduction.py ci-dist-a ci-dist-b
