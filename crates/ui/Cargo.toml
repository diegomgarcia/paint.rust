[package]
name = "paint-ui"
description = "Paint.Rust desktop UI and usability-tested development preview"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
paint-app.workspace = true
paint-core.workspace = true
paint-document.workspace = true
paint-raster.workspace = true
paint-image-io.workspace = true
eframe.workspace = true
egui.workspace = true
serde_json.workspace = true
rfd = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
winit.workspace = true
muda = "0.21.2"
objc2 = "0.6.1"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSSavePanel", "NSPopUpButton", "NSTextField", "NSView"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSArray", "NSURL"] }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["eframe"] }
tempfile.workspace = true

[lints]
workspace = true
